# What Bang offers at boot. Lines are "directive argument"; blank lines and
# anything after a # are ignored. Entries for things this build host happened
# to have — a UEFI shell, a Linux kernel — are appended by the Makefile, so the
# menu never lists something the image does not contain.

timeout 5
default Quark

entry Quark
    multiboot \kernel.bin
    modules   \drivers
