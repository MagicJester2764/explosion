# ExplOSion's packages: which of the files in an image are whose.
#
# A package is a name, a set, a line about it, and what it claims. A file
# belongs to the first package here that claims it, by a pattern (`files`,
# where `*` matches any run of characters, slashes included) or by being a
# program one of the test lists in /etc names (`lists`). `system` comes last
# and claims what is left, so every file in an image is somebody's.
#
# A set is what `qpkg strap ROOT SET...` installs: `base` is a system that
# starts and can be worked at, and the others are what can be added to it.
# `dir` is a directory a package wants to be there though it puts nothing in
# it. `yours` names files, among those a package claims, that are the
# system's owner's to change — who its users are, their passwords, what each
# may do, what a session starts: they are installed as built, and `qpkg
# verify` afterwards asks only that they are there.
#
# tools/stage-packages.py reads this and writes each package's list into the
# stage, at /var/lib/qpkg/NAME, with every file's length and checksum and
# what every program asks to be allowed.

package live
set live
about What makes an installation disc of it: the words it greets with. Not part of what it installs.
files etc/issue etc/motd

package boot
set base
about What the firmware starts: Bang, the kernel, and the services a system runs before it has a root.
files usr/lib/explosion/boot/*

package fstools
set base
about Making and checking filesystems: mkfs.ext4, mkfs.fat, e2fsck and fsck.fat (e2fsprogs and dosfstools).
files usr/bin/mke2fs usr/bin/mkfs.* usr/bin/e2fsck usr/bin/fsck.*

package dbus
set base
about D-Bus: the message bus a session's programs find each other on, and its tools (dbus-daemon, dbus-send, dbus-monitor, dbus-run-session, dbus-uuidgen).
files usr/bin/dbus-* usr/share/dbus-1/* etc/dbus-1/*

package quark
set base
about The kernel's interface, for whoever writes a program: its system call numbers and what they mean.
files usr/include/quark/* usr/share/doc/quark/*

package desktop
set desktop
about Windows: the compositor, a terminal, a GTK program, and the fonts and keyboard maps they draw and type with.
files usr/bin/wm usr/bin/wmdemo usr/bin/wmtype usr/bin/mousetest
files usr/bin/weston-* usr/bin/hello-world usr/bin/wlcairo usr/bin/wlclip usr/bin/wlscroll usr/bin/fc-* usr/bin/gdbus
files usr/share/fonts/* usr/share/xkb/* usr/share/X11/* usr/share/weston/* usr/share/glib-2.0/* usr/share/icons/*
files etc/fonts/* var/cache/fontconfig/*

package tests
set tests
about What the system is checked with: dtest, the fuzzers, every library's own tests, and the driver for the device a test machine is given.
files etc/*.tests etc/hostile-sample
files usr/bin/dtest usr/bin/dchild usr/bin/qfuzz usr/bin/runtests usr/bin/disktest usr/bin/fstest
files usr/bin/threadtest usr/bin/socktest usr/bin/nettest usr/bin/capdemo usr/bin/ipcping usr/bin/envtest
files usr/lib/drivers/EDU.ELF
files usr/bin/wlfuzz usr/bin/wlprobe usr/bin/sigdbg usr/bin/threadfile usr/bin/svctest
files usr/lib/libdl*.so
lists etc/*.tests

package system
set base
about The shell, the tools and the servers' own programs: what a Quark system is to sit at.
dir 0755 dev
dir 0555 proc
dir 1777 tmp
dir 0755 mnt
dir 0700 home/root
yours etc/passwd etc/group etc/shadow etc/rights etc/init.conf
files *
