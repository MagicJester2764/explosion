# Cross file for x86_64-quark, for meson projects.
#
# The compiler is the musl wrapper: it knows where a Quark program loads, what
# its C library is and what to link it with, so nothing here has to say so.
[binaries]
c = 'x86_64-quark-musl-gcc'
ar = 'x86_64-quark-ar'
strip = 'x86_64-quark-strip'
pkg-config = 'pkg-config'
wayland-scanner = '@WAYLAND_SCANNER@'

[properties]
sys_root = '@HOME@/opt/cross/x86_64-quark/sys-root'
pkg_config_libdir = '@HOME@/opt/cross/x86_64-quark/musl/lib/pkgconfig'

[host_machine]
system = 'quark'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
