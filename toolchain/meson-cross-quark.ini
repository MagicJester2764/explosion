# Cross file for x86_64-quark, for meson projects.
#
# The compiler is the musl wrapper: it knows where a Quark program loads, what
# its C library is and what to link it with, so nothing here has to say so.
[binaries]
c = 'x86_64-quark-musl-gcc'
# harfbuzz is written in C++ and pango's build declares the language even where
# it does not use it, so the wrapper is named here rather than in each script.
cpp = 'x86_64-quark-musl-g++'
ar = 'x86_64-quark-ar'
strip = 'x86_64-quark-strip'
pkg-config = 'pkg-config'
wayland-scanner = '@WAYLAND_SCANNER@'

# No sys_root. Meson hands it to pkg-config as the sysroot, which prefixes it
# to every path a .pc file names — and the libraries built here are installed
# in the musl prefix, which is not under it. cairo's -I for pixman came out as
# the sysroot followed by the real path, and nothing found pixman.h.
[properties]
# Both directories: an architecture-independent package installs its
# pkg-config file under share, and wayland-protocols — which is XML and
# nothing else — is one.
pkg_config_libdir = ['@HOME@/opt/cross/x86_64-quark/musl/lib/pkgconfig',
                     '@HOME@/opt/cross/x86_64-quark/musl/share/pkgconfig']

[host_machine]
system = 'quark'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
